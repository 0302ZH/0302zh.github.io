<script>
// ===================== 1. 新旧框显示/隐藏 =====================
function toggleOldNewBox(userId) {
    const box = document.getElementById(`old-new-box-${userId}`);
    if (box.style.display === 'block') {
        box.style.display = 'none';
    } else {
        box.style.display = 'block';
        document.getElementById(`old-new-content-${userId}`).focus();
    }
}

// ===================== 2. 名字选择器折叠/展开 =====================
function toggleNameSelector(userId) {
    const wrapper = document.getElementById(`name-selector-wrapper-${userId}`);
    if (wrapper.style.display === 'block') {
        wrapper.style.display = 'none';
    } else {
        wrapper.style.display = 'block';
    }
}

// 选择名字后自动折叠名字列表
function selectName(inputId, name) {
    document.getElementById(inputId).value = name;
    const userId = inputId.split('-')[1];
    toggleNameSelector(userId);
}

// ===================== 3. 展开/折叠投注详情 =====================
function toggleUserTable(index) {
    const table = document.getElementById(`bet-table-${index}`);
    const btn = document.getElementById(`toggle-btn-${index}`);
    if (table.style.display === 'none') {
        table.style.display = 'table';
        btn.innerHTML = '折叠 🔼';

}

// 1. 基础数据映射
const CHINESE_NUM_MAP = {

   蓝波: [3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48],

// 2. 全局变量
let userCount = 1;
let currentResults = null;
let editingRecordId = null;

// 3. 工具函数
function charToNum(char) {
    if (!isNaN(parseInt(char))) return parseInt(char);
    return CHINESE_NUM_MAP[char] !== undefined ? CHINESE_NUM_MAP[char] : null;
}
function chineseToNumber(chineseStr) {
    if (chineseStr in CHINESE_NUM_MAP) return CHINESE_NUM_MAP[chineseStr];
    let result = 0, temp = 0;
    for (let i=0; i<chineseStr.length; i++) {
        const num = charToNum(chineseStr[i]);
        if (num === 10) {
            temp = temp || 1;
            result += temp * 10;
            temp = 0;
        } else if (num !== null) temp = num;
    }
    return (result + temp) || 1;
}

// 4. 历史记录功能
function initHistory() {
    if (!localStorage.getItem('bettingHistory')) {
        localStorage.setItem('bettingHistory', JSON.stringify([]));
    }
}
function getHistory() {
    return JSON.parse(localStorage.getItem('bettingHistory') || '[]');
}
function saveHistory(history) {
    localStorage.setItem('bettingHistory', JSON.stringify(history));
}
function saveRecord() {
    if (!currentResults) {
        alert('请先计算中奖结果！');
        return;
    }
    const history = getHistory();
    const record = {
        id: editingRecordId || Date.now(),
        timestamp: editingRecordId ? new Date().toLocaleString() + ' (已编辑)' : new Date().toLocaleString(),
        winningNumbers: currentResults.winningNumbers,
        userData: currentResults.userData,
        totals: currentResults.totals
    };
    if (editingRecordId) {
        const idx = history.findIndex(r => r.id === editingRecordId);
        if (idx !== -1) history[idx] = record;
    } else {
        history.unshift(record);
    }
    saveHistory(history);
    alert(editingRecordId ? '记录更新成功！' : '记录保存成功！');
    editingRecordId = null;
}
function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    const history = getHistory().filter(r => r.id !== id);
    saveHistory(history);
    showHistory();
}

示例：
09各10
03.13.20各5新旧"></textarea>

                    <button onclick="selectName('name-${uId}', '黄完家婆')">黄完家婆</button>
                    <button onclick="selectName('name-${uId}', '方业')">方业</button>
                    <button onclick="selectName('name-${uId}', '风兰')">风兰</button>
                    <button onclick="selectName('name-${uId}', '梦思雨')">梦思雨</button>

// 7. 提取数字
function getDigits(text) {
    const digits = [];
    for (let i=0; i<text.length; i++) {
        const num = charToNum(text[i]);
        if (num !== null && num >=0 && num <=9) digits.push(num);
    }
    if (text.includes(',') || text.includes('。')) {
        text.replace(/。/g, ',').split(',').forEach(part => {
            const num = isNaN(parseInt(part.trim())) ? chineseToNumber(part.trim()) : parseInt(part.trim());
            if (num >=0 && num <=9) digits.push(num);
        });
    }
    if (text.includes(':')) {
        text.split(':').forEach(part => {
            const num = isNaN(parseInt(part.trim())) ? chineseToNumber(part.trim()) : parseInt(part.trim());
            if (num >=0 && num <=9) digits.push(num);
        });
    }
    return digits;
}

// 8. 投注拆分：核心修复，先按行拆分，再拆分行内多个投注，兼容新旧后缀
function splitBetsByAmount(text) {
    // 1. 统一换行符，按换行拆分成独立行，保留行结构（不破坏新旧填入的后缀逻辑）
    const lines = text
        .replace(/\r\n|\r|\u2028|\u2029/g, '\n')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line);

    // 2. 对每一行，拆分行内用空格分隔的多个「XX各XX」投注项
    const allBets = [];
    const betRegex = /(?:^|\s)(.*?各(?:\d+|[一二三四五六七八九十两俩百]+)[^\s]*)(?=\s|$)/g;

    lines.forEach(line => {
        let match;
        // 循环提取当前行内的所有投注项
        while ((match = betRegex.exec(line)) !== null) {
            const betItem = match[1].trim();
            if (betItem) allBets.push(betItem);
        }
    });

    // 3. 返回所有拆分后的投注项
    return allBets;
}

// 9. 投注类型判断
function getBetType(line) {
    const clean = line.trim();
    if (/香港|香(?![港澳]|口|水)/.test(clean)) return 'hongkong';
    if (/澳门|新澳|新/.test(clean)) return 'macau';
    if (/旧/.test(clean)) return 'old-macau';
    return 'normal';
}
function getBetTypeLabel(betType) {
    switch(betType) {
        case 'hongkong': return '<span class="bet-type hongkong">香港</span>';
        case 'macau': return '<span class="bet-type macau">新澳</span>';
        case 'old-macau': return '<span class="bet-type old-macau">旧澳</span>';
        default: return '<span class="bet-type normal">普通</span>';
    }
}

// 10. 尾数/头数解析
function parseTailNumbers(text) {
    const nums = [];
    getDigits(text).forEach(d => {
        if (TAIL[d]) nums.push(...TAIL[d]);
    });
    return nums;
}
function parseHeadNumbers(text) {
    const nums = [];
    getDigits(text).forEach(d => {
        if (HEAD[d]) nums.push(...HEAD[d]);
    });
    return nums;
}

// 11. 提取金额（支持门/元/米/块，中文/阿拉伯数字）
function extractAmount(line) {
    let match = line.match(/(包|各(?:数)?)+\s*([一二三四五六七八九十两俩百]+)\s*(?:米|块|元|门)?/i);
    if (match) return chineseToNumber(match[2]);
    match = line.match(/(包|各(?:数)?)+\s*(\d+)\s*(?:米|块|元|门)?(?=\s|$|新|旧|香港|澳门|头|尾)/i);
    if (match) return parseInt(match[2]);
    match = line.match(/各(?:数)?\s*(\d+)\s*(?:米|块|元|门)/i) || line.match(/(\d+)\s*(?:米|块|元|门)(?!\d)/);
    if (match) return parseInt(match[1]);
    match = line.match(/各(?:数)?\s*([一二三四五六七八九十两俩]+)/i);
    if (match) return chineseToNumber(match[1]);
    return 1;
}

// 12. 提取单位：强制所有单位显示为「元」
function extractUnit(line) {
    return '元';
}

// 13. 移除金额和投注类型，保留号码/生肖内容
function getTextExcludingAmount(text) {
    let result = text;
    result = result.replace(/包\s*[一二三四五六七八九十两俩]+\s*(?:米|块|元|门)?/gi, '');
    result = result.replace(/各(?:数)?\s*[一二三四五六七八九十两俩]+\s*(?:米|块|元|门)?/gi, '');
    result = result.replace(/(包|各(?:数)?)+\s*\d+\s*(?:米|块|元|门)?(?=\s|$|新|旧|香港|澳门)/gi, '');
    result = result.replace(/(\d+)\s*(?:米|块|元|门)(?!\d)/g, '');
    result = result.replace(/新澳门|澳门|新澳|旧澳|香港|新旧|新香|旧香|新旧香/gi, '').trim();
    return result;
}

// 14. 号码解析：保留原有逻辑，不去重
function parseNumbers(text) {
    const cleanedText = getTextExcludingAmount(text);
    const formatText = cleanedText
        .replace(/-/g, '.')
        .replace(/\s+/g, '.')
        .replace(/\.+/g, '.')
        .replace(/\.$/, '');
    let nums = [];
    if (cleanedText.includes('尾')) {
        nums = parseTailNumbers(cleanedText);
    } else if (cleanedText.includes('头')) {
        nums = parseHeadNumbers(cleanedText);
    } else {
        const numMatches = formatText.match(/\b\d{1,2}\b/g);
        if (numMatches) {
            numMatches.forEach(match => {
                const n = parseInt(match);
                if (n >=1 && n <=49) nums.push(n);
            });
        }
        for (const [zodiac, zodiacNums] of Object.entries(ZODIAC)) {
            if (cleanedText.includes(zodiac)) nums.push(...zodiacNums);
        }
        for (const [key, color] of Object.entries(COLOR_WAVE)) {
            if (cleanedText.includes(key)) nums.push(...color);
        }
        for (const [pType, pNums] of Object.entries(PARITY)) {
            if (cleanedText.includes(pType)) nums.push(...pNums);
        }
        for (const [cpType, cpNums] of Object.entries(COLOR_PARITY)) {
            if (cleanedText.includes(cpType) || cleanedText.includes(`新${cpType}`) || cleanedText.includes(`旧${cpType}`) || cleanedText.includes(`香${cpType}`)) {
                nums.push(...cpNums);
            }
        }
    }
    return nums;
}

// 16. 中奖金额计算
function getWinningNumByBetType(betType, winning) {
    switch(betType) {
        case 'macau': return winning.macau;
        case 'old-macau': return winning.oldMacau;
        case 'hongkong': return winning.hongkong;
        case 'normal': return winning.macau;
        default: return null;
    }
}
function getWinAmount(betType, perBet, nums, winning) {
    const winNum = getWinningNumByBetType(betType, winning);
    if (!winNum) return 0;
    const winCount = nums.filter(num => num === winNum).length;
    return winCount * perBet * 47;
}
function getWinningDisplay(winning) {
    const parts = [];
    if (winning.macau) parts.push(`新澳 ${getZodiacLabel(winning.macau)}`);
    if (winning.oldMacau) parts.push(`旧澳 ${getZodiacLabel(winning.oldMacau)}`);
    if (winning.hongkong) parts.push(`香港 ${getZodiacLabel(winning.hongkong)}`);
    return parts.join(' | ') || '无有效开奖号码';
}

// 17. 新旧投注处理（核心修复，确保带新旧的投注拆分成新澳和旧澳）
function processNewOldBets(lines) {
    const processed = [];
    lines.forEach(line => {
        const trimLine = line.trim();
        if (!trimLine) return;
        let hasNew = /新|新旧|新香|新旧香/.test(trimLine);
        let hasOld = /旧|新旧|旧香|新旧香/.test(trimLine);
        let hasXiang = /香|新香|旧香|新旧香/.test(trimLine);
        
        let base = trimLine.replace(/新旧|新香|旧香|新旧香/g, '').trim();
        
        if (hasNew) {
            processed.push({
                line: base + '新',
                betType: 'macau',
                originalLine: trimLine,
                isSplit: true,
                splitType: '新澳'
            });
        }
        if (hasOld) {
            processed.push({
                line: base + '旧',
                betType: 'old-macau',
                originalLine: trimLine,
                isSplit: true,
                splitType: '旧澳'
            });
        }
        if (hasXiang) {
            processed.push({
                line: base + '香',
                betType: 'hongkong',
                originalLine: trimLine,
                isSplit: true,
                splitType: '香港'
            });
        }
        if (!hasNew && !hasOld && !hasXiang) {
            processed.push({
                line: trimLine,
                betType: null,
                originalLine: trimLine,
                isSplit: false
            });
        }
    });
    return processed;
}

// 给所有行加上后缀（新旧填入专用，保留行结构）
function applySuffixToAllLines(lines) {
    let suffix = '';
    for (let i = lines.length - 1; i >= 0; i--) {
        const line = lines[i].trim();
        const match = line.match(/(新旧|新香|旧香|新旧香)$/);
        if (match) {
            suffix = match[1];
            break;
        }
    }
    if (!suffix) return lines.filter(l => l.trim());
    return lines.map(l => {
        let line = l.trim();
        if (!line || line.endsWith(suffix)) return line;
        return line + suffix;
    }).filter(l => l.trim());
}

            totalCost += userCost;

                    </h3>
                    <div class="section-title">投注详情</div>
                    <table class="bet-table" id="bet-table-${idx}" style="display:none;">
                        <tr>
                            <th>内容</th>
                            <th>号码数量</th>
                            <th>投入</th>
                            <th>中奖</th>
                        </tr>
                        ${betHtml}
                    </table>
                    <div class="total">
                        💰 投入：<span class="money-blue">${userCost} 元</span> | 中奖：<span class="money-red">${userWin} 元</span> | 净利润：<span class="${(userWin - userCost)>=0 ? 'profit-positive' : 'profit-negative'}">${(userWin - userCost)>=0 ? '+' : ''}${userWin - userCost}</span> 元<br>
                        <span class="total-bet-win">累计中奖投注：<span class="money-red">${userWinBet} 元</span></span><br>
                        <span class="zodiac-display">今日生肖：${getTodayZodiacDisplay(winning)}</span>
                    </div>
                </div>
            `;
            resultInner.innerHTML += userHtml;
        });
        
        const totalProfit = totalWin - totalCost;
        resultInner.innerHTML += `
            <div class="total" style="margin-top:20px;">
                📊 全体汇总：<br>
                总投入：<span class="money-blue">${totalCost} 元</span><br>
                总中奖：<span class="money-red">${totalWin} 元</span><br>
                总净利润：<span class="${totalProfit>=0 ? 'profit-positive' : 'profit-negative'}">${totalProfit>=0 ? '+' : ''}${totalProfit}</span> 元<br>
                <span class="total-bet-win">累计中奖投注：<span class="money-red">${totalWinBet} 元</span></span><br>
                <span class="zodiac-display">今日生肖：${getTodayZodiacDisplay(winning)}</span>
            </div>
        `;
        
        let statsHtml = `
            <div class="user-stats-table">
                <h3>👥 用户详细统计</h3>
                <table class="stats-table">
                    <tr>
                        <th>用户名</th>
                        <th>投入</th>
                        <th>中奖</th>
                        <th>净利润</th>
                        <th>累计中奖投注</th>
                    </tr>
        `;
        userStats.forEach(stat => {
            statsHtml += `
                <tr>
                    <td><strong>${stat.name}</strong></td>
                    <td><span class="money-blue">${stat.cost}</span></td>
                    <td><span class="money-red">${stat.win}</span></td>
                    <td class="${stat.profit>=0 ? 'profit-positive' : 'profit-negative'}">${stat.profit>=0 ? '+' : ''}${stat.profit}</td>
                    <td><span class="money-red">${stat.winBet}</span></td>
                </tr>
            `;
        });
        statsHtml += `</table></div>`;
        resultInner.innerHTML += statsHtml;
        
        currentResults = {
            winningNumbers: winning,
            userData: userData,
            totals: {
                totalCost: totalCost,
                totalWin: totalWin,
                totalProfit: totalProfit,
                totalWinBet: totalWinBet
            }
        };
    } catch (error) {
        alert('计算出错：' + error.message);
        console.error('错误详情：', error);
    }
}

// 19. 辅助函数
function hideResults() {
    document.getElementById('results-container').style.display = 'none';
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
    initHistory();
});
</script>
</body>
</html>
