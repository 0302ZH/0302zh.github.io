<script>
window.oldNewBoxCount = {};
function addOldNewBox(userId) {
    if (!window.oldNewBoxCount[userId]) window.oldNewBoxCount[userId] = 0;
    window.oldNewBoxCount[userId]++;
    const boxId = window.oldNewBoxCount[userId];
    const userCard = document.getElementById(`user-${userId}`);
    const newBox = document.createElement('div');
    newBox.id = `old-new-box-${userId}-${boxId}`;
    newBox.className = 'old-new-box';
    newBox.innerHTML = `
        <textarea id="old-new-content-${userId}-${boxId}" class="old-new-textarea" placeholder="【新旧香专用】
示例：
09各10
03.13.20各5
最后一行加后缀，整框自动添加：
新/旧/香/新旧/新香/旧香/新旧香/香港"></textarea>
        <div style="position: absolute; top: -32px; right: 0; display: flex; gap: 8px;">
            <button style="padding: 6px 12px; font-size: 14px; background: #2d8cf0;" onclick="insertToMainBet(${userId}, 'old-new-content-${userId}-${boxId}')">📥 插入到主框</button>
            <button class="delete" style="padding: 6px 12px; font-size: 14px;" onclick="deleteOldNewBox('old-new-box-${userId}-${boxId}')">🗑️ 删除</button>
        </div>
    `;
    userCard.appendChild(newBox);
}

function insertToMainBet(userId, textareaId) {
    const mainTextarea = document.getElementById(`bets-${userId}`);
    const insertTextarea = document.getElementById(textareaId);
    const content = insertTextarea.value.trim();
    
    if (!content) {
        alert('请输入要插入的内容！');
        return;
    }
    
    const finalLines = applySuffixToAllLines(content.split('\n'));
    const finalContent = finalLines.join('\n');
    
    const start = mainTextarea.selectionStart;
    const end = mainTextarea.selectionEnd;
    const before = mainTextarea.value.substring(0, start);
    const after = mainTextarea.value.substring(end);
    
    const prefix = (before && before[before.length - 1] !== '\n') ? '\n' : '';
    const suffix = (after && after[0] !== '\n') ? '\n' : '';
    
    mainTextarea.value = before + prefix + finalContent + suffix + after;
    insertTextarea.value = '';
    mainTextarea.focus();
}

function deleteOldNewBox(boxId) {
    const box = document.getElementById(boxId);
    if (box) box.remove();
}

function toggleNameSelector(userId) {
    const wrapper = document.getElementById(`name-selector-wrapper-${userId}`);
    wrapper.style.display = wrapper.style.display === 'block' ? 'none' : 'block';
}

function selectName(inputId, name) {
    document.getElementById(inputId).value = name;
    const userId = inputId.split('-')[1];
    toggleNameSelector(userId);
}

function toggleUserTable(index) {
    const table = document.getElementById(`bet-table-${index}`);
    const btn = document.getElementById(`toggle-btn-${index}`);
    if (table.style.display === 'none') {
        table.style.display = 'table';
        btn.innerHTML = '折叠 🔼';
    } else {
        table.style.display = 'none';
        btn.innerHTML = '展开 🔽';
    }
}

function toggleHistoryStats() {
    const statsDiv = document.getElementById('history-user-stats');
    const title = document.querySelector('.user-stats-table h3');
    if (statsDiv.style.display === 'none' || statsDiv.style.display === '') {
        statsDiv.style.display = 'block';
        title.innerHTML = '👥 历史用户汇总统计 🔼';
    } else {
        statsDiv.style.display = 'none';
        title.innerHTML = '👥 历史用户汇总统计 🔽';
    }
}

function getZodiacByNum(num) {
    for (const [zodiac, nums] of Object.entries(ZODIAC)) {
        if (nums.includes(num)) return zodiac;
    }
    return null;
}

function getPingTeZodiacs(text) {
    const zodiacs = [];
    for (const [zodiac] of Object.entries(ZODIAC)) {
        if (text.includes(zodiac)) zodiacs.push(zodiac);
    }
    return zodiacs;
}

function charToNum(char) {
    if (!isNaN(parseInt(char))) return parseInt(char);
    return CHINESE_NUM_MAP[char] !== undefined ? CHINESE_NUM_MAP[char] : null;
}

function chineseToNumber(chineseStr) {
    if (chineseStr in CHINESE_NUM_MAP) return CHINESE_NUM_MAP[chineseStr];
    let result = 0, temp = 0;
    for (let i=0; i<chineseStr.length; i++) {
        const num = charToNum(chineseStr[i]);
        if (num === 10) {
            temp = temp || 1;
            result += temp * 10;
            temp = 0;
        } else if (num !== null) temp = num;
    }
    return (result + temp) || 1;
}

function initHistory() {
    if (!localStorage.getItem('bettingHistory')) {
        localStorage.setItem('bettingHistory', JSON.stringify([]));
    }
}

function getHistory() {
    return JSON.parse(localStorage.getItem('bettingHistory') || '[]');
}

function saveHistory(history) {
    localStorage.setItem('bettingHistory', JSON.stringify(history));
}

function saveRecord(isAuto = false) {
    if (!currentResults) {
        if (!isAuto) alert('请先计算中奖结果！');
        return;
    }
    const dateVal = document.getElementById('record-date').value;
    if (!dateVal) {
        alert('请选择记录日期！');
        return;
    }
    
    const history = getHistory();
    const selectedDate = new Date(dateVal).toLocaleDateString();
    const currentTime = new Date().toLocaleTimeString();
    
    const dateRecordIndex = history.findIndex(r => {
        const recordDate = new Date(r.timestamp.split(' ')[0]).toLocaleDateString();
        return recordDate === selectedDate;
    });
    
    const record = {
        id: editingRecordId || Date.now(),
        timestamp: editingRecordId ? `${selectedDate} ${currentTime} (已编辑)` : `${selectedDate} ${currentTime}`,
        winningNumbers: currentResults.winningNumbers,
        userData: currentResults.userData,
        userStats: currentResults.userStats,
        totals: currentResults.totals
    };
    
    if (dateRecordIndex !== -1 && !editingRecordId) {
        if (!confirm(`${selectedDate} 已有记录，是否替换为最新记录？`)) {
            return;
        }
        history[dateRecordIndex] = record;
    } else if (editingRecordId) {
        const idx = history.findIndex(r => r.id === editingRecordId);
        if (idx !== -1) history[idx] = record;
    } else {
        history.unshift(record);
    }
    
    saveHistory(history);
    if (!isAuto) alert(editingRecordId ? '记录更新成功！' : '记录保存成功！');
    editingRecordId = null;
}

function deleteRecord(id) {
    if (!confirm('确定删除这条记录吗？')) return;
    const history = getHistory().filter(r => r.id !== id);
    saveHistory(history);
    showHistory();
}

function showHistory() {

    history.forEach(record => {
        (record.userStats || []).forEach(stat => {
            if (!userStatsMap[stat.name]) {
                userStatsMap[stat.name] = {
                    name: stat.name,
                    cost: 0,
                    win: 0,
                    profit: 0,
                    winBet: 0
                };

            userStatsMap[stat.name].cost += stat.cost || 0;
            userStatsMap[stat.name].win += stat.win || 0;
            userStatsMap[stat.name].profit += (stat.win || 0) - (stat.cost || 0);

function getDigits(text) {
    const digits = [];
    for (let i=0; i<text.length; i++) {
        const num = charToNum(text[i]);
        if (num !== null && num >=0 && num <=9) digits.push(num);
    }
    if (text.includes(',') || text.includes('。')) {
        text.replace(/。/g, ',').split(',').forEach(part => {
            const num = isNaN(parseInt(part.trim())) ? chineseToNumber(part.trim()) : parseInt(part.trim());
            if (num >=0 && num <=9) digits.push(num);
        });
    }
    if (text.includes(':')) {
        text.split(':').forEach(part => {
            const num = isNaN(parseInt(part.trim())) ? chineseToNumber(part.trim()) : parseInt(part.trim());
            if (num >=0 && num <=9) digits.push(num);
        });
    }
    return digits;
}

function splitBetsByAmount(text) {
    const lines = text
        .replace(/\r\n|\r|\u2028|\u2029/g, '\n')
        .split('\n')
        .map(line => line.trim())
        .filter(line => line);
    const allBets = [];
    const betRegex = /(?:^|\s)(.*?(?:平特.*?[.。-]\d+\s*[.。]?\s*米|各(?:数|号)?\s*(?:\d+|[一二三四五六七八九十两俩百]+)|[.。-]\d+\s*[.。]?\s*米)[^\s]*)(?=\s|$)/g;
    lines.forEach(line => {
        let match;
        while ((match = betRegex.exec(line)) !== null) {
            const betItem = match[1].trim();
            if (betItem) allBets.push(betItem);
        }
    });
    return allBets;
}

function getBetType(line) {
    const clean = line.trim();
    if (/旧/.test(clean)) return 'old-macau';

    if (/香港|香(?![口|水])/.test(clean)) return 'hongkong';
    return 'normal';
}

function extractAmount(line) {
    const cleanLine = line.trim().replace(/[.。,，]+$/, '');
    let match = cleanLine.match(/[.。-]\s*(\d+)\s*[.。]?\s*米/i);
    if (match) return parseInt(match[1]);
    match = cleanLine.match(/(包|各(?:数|号)?)+\s*([一二三四五六七八九十两俩百]+)\s*(?:米|块|元|门)?/i);
    if (match) return chineseToNumber(match[2]);
    match = cleanLine.match(/(包|各(?:数|号)?)+\s*(\d+)\s*(?:米|块|元|门)?(?=\s|$|新|旧|香|港|澳|门|头|尾|.)/i);
    if (match) return parseInt(match[2]);
    match = cleanLine.match(/各(?:数|号)?\s*(\d+)\s*(?:米|块|元|门)/i) || cleanLine.match(/(\d+)\s*(?:米|块|元|门)(?!\d)/);
    if (match) return parseInt(match[1]);
    match = cleanLine.match(/各(?:数|号)?\s*([一二三四五六七八九十两俩]+)/i);
    if (match) return chineseToNumber(match[1]);
    return 1;
}

function getTextExcludingAmount(text) {
    let result = text.trim().replace(/[.。,，]+$/, '');
    result = result.replace(/[.。-]\s*\d+\s*[.。]?\s*米/gi, '');
    result = result.replace(/包\s*[一二三四五六七八九十两俩百]+\s*(?:米|块|元|门)?/gi, '');
    result = result.replace(/各(?:数|号)?\s*[一二三四五六七八九十两俩百]+\s*(?:米|块|元|门)?/gi, '');
    result = result.replace(/(包|各(?:数|号)?)+\s*\d+\s*(?:米|块|元|门)?(?=\s|$|新|旧|香|港|澳|门|头|尾|.)/gi, '');
    result = result.replace(/(\d+)\s*(?:米|块|元|门)(?!\d)/g, '');
    result = result.replace(/新旧香|新香|旧香|新旧|香港|澳门|新澳|旧澳|新|旧|香|港|澳/gi, '').trim();
    return result;
}

function parseNumbers(text) {
    const cleanedText = getTextExcludingAmount(text);
    
    if (cleanedText.includes('红单')) return [1,7,13,19,23,29,35,45];
    if (cleanedText.includes('红双')) return [2,8,12,18,24,30,34,40,46];
    if (cleanedText.includes('蓝单')) return [3,9,15,25,31,37,41,47];
    if (cleanedText.includes('蓝双')) return [4,10,14,20,26,36,42,48];
    if (cleanedText.includes('绿单')) return [5,11,17,21,27,33,39,43,49];
    if (cleanedText.includes('绿双')) return [6,16,22,28,32,38,44];

    let nums = [];
    if (cleanedText.includes('大数')) {
        for (let i=25; i<=49; i++) nums.push(i);
    } else if (cleanedText.includes('小数')) {
        for (let i=1; i<=24; i++) nums.push(i);
    } 
    else if (cleanedText.includes('尾')) {
        nums = parseTailNumbers(cleanedText);
    } else if (cleanedText.includes('头')) {
        nums = parseHeadNumbers(cleanedText);
    } 
    else {
        const formatText = cleanedText
            .replace(/-/g, '.')
            .replace(/\s+/g, '.')
            .replace(/\.+/g, '.')
            .replace(/^\./, '')
            .replace(/\.$/, '');
        const numMatches = formatText.match(/\b\d{1,2}\b/g);
        if (numMatches) {
            numMatches.forEach(match => {
                const n = parseInt(match);
                if (n >=1 && n <=49) nums.push(n);
            });
        }
        const zodiacList = Object.entries(ZODIAC);
        zodiacList.sort((a, b) => b[0].length - a[0].length);
        for (const [zodiac, zodiacNums] of zodiacList) {
            const regex = new RegExp(zodiac, 'g');
            const count = (cleanedText.match(regex) || []).length;
            for (let i = 0; i < count; i++) {
                nums.push(...zodiacNums);
            }
        }
        
        const colorMap = {
            '红': '红波',
            '蓝': '蓝波',
            '绿': '绿波'
        };
        
        const colorCombos = [
            { key: '红蓝波', colors: ['红波', '蓝波'] },
            { key: '红绿波', colors: ['红波', '绿波'] },
            { key: '蓝绿波', colors: ['蓝波', '绿波'] },
            { key: '红蓝绿波', colors: ['红波', '蓝波', '绿波'] },
            { key: '红蓝', colors: ['红波', '蓝波'] },
            { key: '红绿', colors: ['红波', '绿波'] },
            { key: '蓝绿', colors: ['蓝波', '绿波'] },
            { key: '红蓝绿', colors: ['红波', '蓝波', '绿波'] }
        ];
        
        let matchedCombo = false;
        for (const combo of colorCombos) {
            if (cleanedText.includes(combo.key)) {
                combo.colors.forEach(color => {
                    nums.push(...COLOR_WAVE[color]);
                });
                matchedCombo = true;
                break;
            }
        }
        
        if (!matchedCombo) {
            for (const [key, color] of Object.entries(COLOR_WAVE)) {
                if (cleanedText.includes(key)) {
                    nums.push(...color);
                    matchedCombo = true;
                    break;
                }
            }
            
            if (!matchedCombo) {
                for (const [short, full] of Object.entries(colorMap)) {
                    if (cleanedText.includes(short)) {
                        nums.push(...COLOR_WAVE[full]);
                        break;
                    }
                }
            }
        }
        
        for (const [pType, pNums] of Object.entries(PARITY)) {
            if (cleanedText.includes(pType)) nums.push(...pNums);
        }
    }
    return nums;
}

    const macau = parseInt(document.getElementById('winning-macau').value.trim());
    const oldMacau = parseInt(document.getElementById('winning-old-macau').value.trim());
    const hongkong = parseInt(document.getElementById('winning-hongkong').value.trim());
    const pingte = document.getElementById('winning-pingte').checked;
    
    if (!isNaN(macau) && macau >=1 && macau <=49) winning.macau = macau;
    if (!isNaN(oldMacau) && oldMacau >=1 && oldMacau <=49) winning.oldMacau = oldMacau;
    if (!isNaN(hongkong) && hongkong >=1 && hongkong <=49) winning.hongkong = hongkong;
    winning.pingte = pingte;
    
    return winning;
}

function getWinningNumByBetType(betType, winning) {
    switch(betType) {
        case 'macau': return winning.macau;
        case 'old-macau': return winning.oldMacau;
        case 'hongkong': return winning.hongkong;
        case 'normal': return winning.macau;
        default: return null;
    }
}

function getWinAmount(betType, perBet, nums, winning, isPingTe = false, pingTeZodiacs = [], isLianXiao = false) {
    const winNum = getWinningNumByBetType(betType, winning);
    if (!winNum) return 0;
    if (isPingTe) {
        if (!winning.pingte) return 0;
        return perBet * 2;
    }
    const winCount = nums.filter(num => num === winNum).length;
    if (isLianXiao && winCount > 0) {
        return perBet * 47;
    }
    return winCount * perBet * 47;
}

function getWinningDisplay(winning) {
    const parts = [];
    if (winning.macau) parts.push(`新澳 ${getZodiacLabel(winning.macau)}`);
    if (winning.oldMacau) parts.push(`旧澳 ${getZodiacLabel(winning.oldMacau)}`);
    if (winning.hongkong) parts.push(`香港 ${getZodiacLabel(winning.hongkong)}`);
    parts.push(`平特: ${winning.pingte ? '中' : '未中'}`);
    return parts.join(' | ') || '无有效开奖号码';
}

function applySuffixToAllLines(lines) {
    const suffixRegexEnd = /(新旧香|新香|旧香|新旧|香港|新|旧|香)$/;
    const suffixRegexStart = /^(新旧香|新香|旧香|新旧|香港|新|旧|香)/;
    let suffix = '';
    const validLines = lines.filter(l => l.trim());
    if (validLines.length === 0) return [];

    for (let i = validLines.length - 1; i >= 0; i--) {
        const line = validLines[i].trim();
        const match = line.match(suffixRegexEnd);
        if (match) {
            suffix = match[1];
            break;
        }
    }

    if (!suffix) {
        const firstLine = validLines[0].trim();
        const match = firstLine.match(suffixRegexStart);
        if (match) {
            suffix = match[1];
        }
    }

    if (!suffix) return validLines;

    return validLines.map(line => {
        let cleanLine = line.trim();
        cleanLine = cleanLine.replace(suffixRegexStart, '').trim();
        cleanLine = cleanLine.replace(suffixRegexEnd, '').trim();
        return cleanLine + suffix;
    });
}

function processNewOldBets(lines) {
    const processed = [];
    lines.forEach(line => {
        const trimLine = line.trim();
        if (!trimLine) return;
        const isPingTe = trimLine.includes('平特');
        const isLianXiao = /连肖/i.test(trimLine);
        let hasNew = /新|新旧|新香|新旧香/.test(trimLine);
        let hasOld = /旧|新旧|旧香|新旧香/.test(trimLine);
        let hasXiang = /香|新香|旧香|新旧香|香港/.test(trimLine);
        
        let base = trimLine.replace(/新旧香|新香|旧香|新旧|香港|澳门|新澳|旧澳|新|旧|香|港|澳/g, '').trim();
        
        if (hasNew) {
            processed.push({
                line: base + '新',
                betType: 'macau',
                originalLine: trimLine,
                isSplit: true,
                splitType: '新澳',
                isPingTe: isPingTe,
                isLianXiao: isLianXiao
            });
        }
        if (hasOld) {
            processed.push({
                line: base + '旧',
                betType: 'old-macau',
                originalLine: trimLine,
                isSplit: true,
                splitType: '旧澳',
                isPingTe: isPingTe,
                isLianXiao: isLianXiao
            });
        }
        if (hasXiang) {
            processed.push({
                line: base + '香',
                betType: 'hongkong',
                originalLine: trimLine,
                isSplit: true,
                splitType: '香港',
                isPingTe: isPingTe,
                isLianXiao: isLianXiao
            });
        }
        if (!hasNew && !hasOld && !hasXiang) {
            processed.push({
                line: trimLine,
                betType: null,
                originalLine: trimLine,
                isSplit: false,
                isPingTe: isPingTe,
                isLianXiao: isLianXiao
            });
        }
    });
    return processed;
}

function showResults() {
    try {
        const winning = getWinningNumbers();
        if (!winning.macau) {
            alert('请输入1-49的新澳开奖号码！');
            return;
        }
        
        const userData = [];
        document.querySelectorAll('#users-container .user-card').forEach(card => {
            const id = card.id.replace('user-', '');
            const name = document.getElementById(`name-${id}`).value.trim() || `用户${id}`;
            const bets = document.getElementById(`bets-${id}`).value.trim();
            
            let extraText = '';
            document.querySelectorAll(`[id^="old-new-content-${id}-"]`).forEach(ta => {
                const content = ta.value.trim();
                if (content) {
                    const finalLines = applySuffixToAllLines(content.split('\n'));
                    extraText += '\n' + finalLines.join('\n');
                }
            });
            const mainText = (bets || '') + extraText;
            if (mainText.trim()) {
                userData.push({ name, bets: mainText.trim() });
            }
        });
        
        if (userData.length === 0) {
            alert('请至少输入一个用户的投注内容！');
            return;
        }
        
        document.getElementById('results-container').style.display = 'block';
        document.getElementById('win-display-all').textContent = `开奖号码：${getWinningDisplay(winning)}`;
        document.getElementById('time-display').textContent = `生成时间：${new Date().toLocaleString()}`;
        const resultInner = document.getElementById('results-inner');
        resultInner.innerHTML = '';
        
        const userStats = [];
        let totalCost = 0, totalWin = 0, totalWinBet = 0;
        
        userData.forEach((user, idx) => {
            const lines = splitBetsByAmount(user.bets);
            const processedLines = processNewOldBets(lines);
            
            let userCost = 0, userWin = 0, userWinBet = 0;
            let betHtml = '';
            
            processedLines.forEach(item => {
                const line = item.line;
                                const betType = item.betType || getBetType(line);
                const isPingTe = item.isPingTe;
                const isLianXiao = item.isLianXiao;
                const pingTeZodiacs = isPingTe ? getPingTeZodiacs(line) : [];
                const perBet = extractAmount(line);
                const unit = extractUnit(line);
                const nums = parseNumbers(line);
                if (nums.length === 0 && !isPingTe) return;
                
                const winNum = getWinningNumByBetType(betType, winning);
                
                let cost;
                if (isPingTe) {
                    cost = perBet * pingTeZodiacs.length;
                } else if (isLianXiao) {
                    cost = perBet;
                } else {
                    cost = nums.length * perBet;
                }
                
                const winMoney = getWinAmount(betType, perBet, nums, winning, isPingTe, pingTeZodiacs, isLianXiao);
                const isWin = winMoney > 0;
                
                let winBet = 0;
                if (isWin) {
                    if (isPingTe) {
                        winBet = perBet;
                    } else if (isLianXiao) {
                        winBet = perBet;
                    } else {
                        winBet = nums.filter(n => n === winNum).length * perBet;
                    }
                }
                
                userCost += cost;
                userWin += winMoney;
                userWinBet += winBet;
                
                const lineDisplay = item.isSplit ? `<span title="原投注: ${item.originalLine}">${line}</span>` : line;
                const headTailDesc = line.includes('头') ? `（头数: ${getDigits(line).join(', ')}）` : (line.includes('尾') ? `（尾数: ${getDigits(line).join(', ')}）` : '');
                const markedNums = nums.map(num => num === winNum ? `<span class="money-red">${num}</span>` : num).join(', ');
                
                betHtml += `
                    <tr>
                        <td>${lineDisplay} ${getBetTypeLabel(betType)}</td>
                        <td>${isPingTe ? pingTeZodiacs.length : (isLianXiao ? 1 : nums.length)}</td>
                        <td><span class="money-blue">${cost} ${unit}</span></td>
                        <td class="${isWin ? 'win' : ''}"><span class="money-red">${isWin ? winMoney + ' 元' : '-'}</span></td>
                    </tr>
                `;
                if (item.isSplit) {
                    betHtml += `
                        <tr>
                            <td colspan="4" class="split-info">📝 自动拆分自: "${item.originalLine}" → ${item.splitType}</td>
                        </tr>
                    `;
                }
                let debugInfo = '';
                if (isPingTe) {
                    debugInfo = `【平特投注】生肖: ${pingTeZodiacs.join(',')} | 单注: ${perBet}${unit} | 总投入: ${cost}${unit} | 平特开关: ${winning.pingte ? '开(中奖)' : '关(未中)'} | 赔率: 2倍`;
                } else if (isLianXiao) {
                    debugInfo = `【连肖投注】生肖号码: ${markedNums} ${headTailDesc}| 单注: ${perBet}${unit} | 开奖号: ${winNum || '无'}`;
                } else {
                    debugInfo = `解析号码: ${markedNums} ${headTailDesc}| 单注: ${perBet}${unit} | 开奖号: ${winNum || '无'}`;
                }
                betHtml += `
                    <tr>
                        <td colspan="4" class="debug-info">${debugInfo}</td>
                    </tr>
                `;
            });
            
            totalCost += userCost;
            totalWin += userWin;
            totalWinBet += userWinBet;
            userStats.push({
                name: user.name,
                cost: userCost,
                win: userWin,
                profit: userWin - userCost,
                winBet: userWinBet
            });
            
            const userHtml = `
                <div class="result-card">
                    <h3>👤 ${user.name} 
                        <button id="toggle-btn-${idx}" onclick="toggleUserTable(${idx})" style="margin-left:12px; padding:8px 14px; font-size:15px; background:#ff9500; border:none; border-radius:6px; color:white; cursor:pointer;">折叠 🔼</button>
                    </h3>
                    <div class="section-title">投注详情</div>
                    <table class="bet-table" id="bet-table-${idx}">
                        <tr>
                            <th>内容</th>
                            <th>数量</th>
                            <th>投入</th>
                            <th>中奖</th>
                        </tr>
                        ${betHtml}
                    </table>
                    <div class="total">
                        💰 投入：<span class="money-blue">${userCost} 元</span> | 中奖：<span class="money-red">${userWin} 元</span> | 净利润：<span class="${(userWin - userCost)>=0 ? 'profit-positive' : 'profit-negative'}">${(userWin - userCost)>=0 ? '+' : ''}${userWin - userCost}</span> 元<br>
                        <span class="total-bet-win">累计中奖投注：<span class="money-red">${userWinBet} 元</span></span><br>
                        <span class="zodiac-display">今日生肖：${getTodayZodiacDisplay(winning)}</span>
                    </div>
                </div>
            `;
            resultInner.innerHTML += userHtml;
        });

        const totalProfit = totalWin - totalCost;
        const waterMoney = totalCost * 0.03;

        resultInner.innerHTML += `
            <div class="total" style="margin-top:20px;">
                📊 全体汇总：<br>
                总投入：<span class="money-blue">${totalCost} 元</span> | 水钱：<span class="money-blue">${waterMoney.toFixed(2)} 元</span><br>
                总中奖：<span class="money-red">${totalWin} 元</span><br>
                总净利润：<span class="${totalProfit>=0 ? 'profit-positive' : 'profit-negative'}">${totalProfit>=0 ? '+' : ''}${totalProfit}</span> 元<br>
                <span class="total-bet-win">累计中奖投注：<span class="money-red">${totalWinBet} 元</span></span><br>
                <span class="zodiac-display">今日生肖：${getTodayZodiacDisplay(winning)}</span>
            </div>
        `;

        let statsHtml = `
            <div class="user-stats-table">
                <h3>👥 用户详细统计</h3>
                <table class="stats-table">
                    <tr>
                        <th>用户名</th>
                        <th>投入</th>
                        <th>中奖</th>
                        <th>净利润</th>
                        <th>累计中奖投注</th>
                    </tr>
        `;
        userStats.forEach(stat => {
            statsHtml += `
                <tr>
                    <td><strong>${stat.name}</strong></td>
                    <td><span class="money-blue">${stat.cost}</span></td>
                    <td><span class="money-red">${stat.win}</span></td>
                    <td class="${stat.profit>=0 ? 'profit-positive' : 'profit-negative'}">${stat.profit>=0 ? '+' : ''}${stat.profit}</td>
                    <td><span class="money-red">${stat.winBet}</span></td>
                </tr>
            `;
        });
        statsHtml += `</table></div>

<div class="user-stats-table" style="margin-top:12px;">
    <h3>📝 简洁汇总</h3>
    <div style="line-height:1.9; font-size:15px; padding:12px; background:#fafafa; border-radius:8px;">
        ${userStats.map(stat => {
            if (stat.winBet > 0) {
                return `${stat.name}中${stat.winBet}元，${stat.win}-${stat.cost}=${stat.profit}元`;
            } else {
                return `${stat.name}-${stat.cost}元`;
            }
        }).join('<br>')}
    </div>
</div>
`;
        resultInner.innerHTML += statsHtml;

        currentResults = {
            winningNumbers: winning,
            userData: userData,
            userStats: userStats,
            totals: {
                totalCost: totalCost,
                totalWin: totalWin,
                totalProfit: totalProfit,
                totalWinBet: totalWinBet,
                waterMoney: waterMoney
            }
        };
        saveRecord(true);
    } catch (error) {
        alert('计算出错：' + error.message);
        console.error('错误详情：', error);
    }
}

function hideResults() {
    document.getElementById('results-container').style.display = 'none';
}

function clearAllHistory() {
    if (!confirm('确定要清空所有历史记录吗？此操作不可恢复！')) return;
    localStorage.removeItem('bettingHistory');
    showHistory();
    alert('已清空所有历史记录！');
}

// 滚动自动折叠上方用户卡片
let scrollTimer = null;
function autoFoldOnScroll() {
    const cards = document.querySelectorAll('.result-card');
    cards.forEach((card, idx) => {
        const rect = card.getBoundingClientRect();
        const table = document.getElementById(`bet-table-${idx}`);
        const btn = document.getElementById(`toggle-btn-${idx}`);
        if (!table || !btn) return;
        // 卡片完全滚出屏幕顶部时自动折叠
        if (rect.bottom < 0) {
            if (table.style.display !== 'none') {
                table.style.display = 'none';
                btn.innerHTML = '展开 🔽';
            }
        }
    });
}
window.addEventListener('scroll', function() {
    if (scrollTimer) return;
    scrollTimer = setTimeout(() => {
        autoFoldOnScroll();
        scrollTimer = null;
    }, 100);
});

// 防误触返回功能
let backPressCount = 0;
window.addEventListener('beforeunload', function(e) {
    const hasContent = Array.from(document.querySelectorAll('textarea, input[type="text"], input[type="number"]')).some(el => el.value.trim() !== '');
    if (hasContent) {
        e.preventDefault();
        e.returnValue = '您有未保存的投注内容，确定要离开吗？';
        return e.returnValue;
    }
});

// 移动端返回按钮拦截
window.addEventListener('popstate', function(e) {
    const hasContent = Array.from(document.querySelectorAll('textarea, input[type="text"], input[type="number"]')).some(el => el.value.trim() !== '');
    if (hasContent && backPressCount === 0) {
        e.preventDefault();
        history.pushState(null, null, location.href);
        backPressCount++;
        alert('再按一次返回键将离开页面，未保存的内容将丢失');
        setTimeout(() => { backPressCount = 0; }, 2000);
    } else {
        backPressCount = 0;
    }
});

// 初始化时添加一条历史记录用于拦截
history.pushState(null, null, location.href);

document.addEventListener('DOMContentLoaded', function() {
    initHistory();
    // 打开页面默认填充当天日期
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById('record-date').value = `${year}-${month}-${day}`;
});
</script>
